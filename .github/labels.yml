# Source of truth for the repository labels. Labels missing from this file are removed on sync.
# Colors are quoted: a YAML 1.2 parser reads an all-digit color such as 008672 as a number.

- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: documentation
  color: "0075ca"
  description: Documentation only
- name: performance
  color: "fbca04"
  description: Performance improvement or regression
- name: breaking-change
  color: "b60205"
  description: Incompatible change to the public API or behavior
- name: security
  color: "ee0701"
  description: Security issue or hardening
- name: dependencies
  color: "0366d6"
  description: Dependency update
- name: question
  color: "d876e3"
  description: Further information is requested
- name: good first issue
  color: "7057ff"
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed
- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists
- name: invalid
  color: "e4e669"
  description: This doesn't seem right
- name: wontfix
  color: "ffffff"
  description: This will not be worked on

