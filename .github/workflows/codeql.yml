name: CodeQL

on:
  pull_request:
  push:
    branches: [main, ci/native-matrix]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # A traced build hands the extractor the exact compiler arguments and generated sources
          # of the pinned SDK; build-mode none would guess references from the project files.
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none
          # The C shim of build/miniaudio/ (docs/adr/0037).
          - language: c-cpp
            build-mode: manual
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: false

      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build -c Release

      # Only the shim is compiled: miniaudio is third-party code, fetched outside the checkout at
      # its pinned commit for its header.
      - name: Build the C shims
        if: matrix.language == 'c-cpp'
        run: |
          repository=$(jq -r .dependencies.miniaudio.repository build/versions.json)
          commit=$(jq -r .dependencies.miniaudio.commit build/versions.json)
          git init -q "$RUNNER_TEMP/miniaudio"
          git -C "$RUNNER_TEMP/miniaudio" fetch -q --depth 1 "$repository" "$commit"
          git -C "$RUNNER_TEMP/miniaudio" checkout -q --detach FETCH_HEAD
          cc -c -std=c17 -O2 -Wall -Werror -include build/miniaudio/config.h -I "$RUNNER_TEMP/miniaudio" \
            build/miniaudio/jade_miniaudio.c -o "$RUNNER_TEMP/jade_miniaudio.o"

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
