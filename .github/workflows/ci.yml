name: CI

on:
  pull_request:
  push:
    branches: [main, ci/native-matrix]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check formatting
        run: dotnet format --verify-no-changes

  build:
    # Check names come from matrix.name, not the runner label, so that moving to a newer runner
    # image does not rename the checks required by the ruleset.
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-2025
          - name: macos
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true

      # The generator is a file-based app outside Jade.slnx. Regenerating on every runner checks
      # that the committed bindings and layout tests are current and that the output does not
      # depend on the host.
      - name: Build the binding generator
        run: dotnet build scripts/binding-generator.cs -c Release -p:TreatWarningsAsErrors=true

      # The native workflow runs these scripts only when its inputs change.
      - name: Build the native scripts
        run: |
          dotnet build scripts/build-native.cs -c Release -p:TreatWarningsAsErrors=true
          dotnet build scripts/fetch-native.cs -c Release -p:TreatWarningsAsErrors=true

      - name: Check the generated bindings
        shell: bash
        run: |
          dotnet run scripts/binding-generator.cs -c Release --no-build
          git add --intent-to-add -- interop build/layout tests
          git diff --exit-code --stat -- interop build/layout tests
