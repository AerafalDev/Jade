name: CI

# A pull request that only touches design/ and Markdown files skips the build and style jobs. The workflow
# itself always runs, so that its checks still report if they become required: a path filter would leave
# them pending. CI result sums up the jobs for that purpose.
on:
  push:
    branches: [main, ci/measure-base]
  pull_request:
    branches: [main, ci/measure-base]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A pull request is checked out as its merge commit, whose first parent is the base branch: the diff is
      # what merging would change. --no-renames also lists the old path of a moved file. README.md is packed
      # into the packages, so it counts as code here.
      - name: Classify the changes
        id: classify
        shell: bash
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --no-renames --name-only HEAD^1 HEAD)
            changed=$(awk '!/^design\// && (!/\.md$/ || $0 == "README.md")' <<< "$files")
            printf 'Changed files that need the checks:\n%s\n' "${changed:-none}"
            [ -n "$changed" ] || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    env:
      # TreatWarningsAsErrors only covers compiler, analyzer and NuGet warnings. This also fails the
      # job on MSBuild task warnings (SourceLink, MinVer, SDK), which local builds leave as warnings.
      MSBuildTreatWarningsAsErrors: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --results-directory TestResults --report-xunit-trx --report-xunit-trx-filename test-results.trx

      - name: Pack
        run: dotnet pack -c Release -o artifacts/packages

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  style:
    name: Code style
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    env:
      MSBuildTreatWarningsAsErrors: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The build job never compiles scripts; native.yml compiles them on every desktop OS but checks no style. A build
      # fails on every ADR-0011 rule that Roslyn runs on build.
      - name: Build scripts
        run: for script in scripts/*.cs; do dotnet build "$script"; done

      # Roslyn never runs IDE0003 (this.) and IDE0049 (keywords over BCL type names) on build, and no build analyzer
      # checks using order: dotnet format reports all three. It skips generated files unless told otherwise, which
      # would leave out the bindings; obj/ only holds SDK-generated sources.
      - name: Check style of the solution
        run: dotnet format --verify-no-changes --include-generated --exclude '**/obj/**'

      # dotnet format cannot load a file-based app, so each script is checked as a converted throwaway project. The
      # copies stay inside the repository so that its .editorconfig and Directory.*.props still apply to them.
      - name: Check style of the scripts
        run: |
          for script in scripts/*.cs; do
            name=$(basename "$script" .cs)
            dotnet project convert "$script" --output "artifacts/format/$name"
            dotnet format "artifacts/format/$name/$name.csproj" --verify-no-changes
          done

  # The one check to require: the matrix jobs above are skipped as a whole for docs-only pull requests, and
  # their names change with the matrix.
  result:
    name: CI result
    needs: [changes, build, style]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Check the jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Jobs: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
