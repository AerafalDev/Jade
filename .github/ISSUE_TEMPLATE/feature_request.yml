name: Feature request
description: Suggest a new capability or a change to an existing one.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The [roadmap](https://github.com/AerafalDev/Jade/blob/main/docs/roadmap.md) lists what is planned and what is out of scope for now.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like Jade to do? An API sketch helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches or workarounds you considered.
