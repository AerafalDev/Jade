version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    # These replace Dependabot's default labels. Dependabot skips a label the repository lacks, so each one is declared
    # in .github/labels.yml.
    labels: ["dependencies", "type: build"]
    groups:
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies", "github_actions", "type: ci"]
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # Track the floating major tag (@v4) instead of pinning every minor/patch release.
      - dependency-name: "github/codeql-action"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
